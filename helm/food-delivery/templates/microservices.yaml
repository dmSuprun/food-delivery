{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "food-delivery.labels" $ | nindent 4 }}
spec:
  {{- if not $svc.autoscaling }}
  replicas: {{ $.Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
      - name: {{ $name }}
        image: {{ include "food-delivery.image" (dict "root" $ "name" $name) }}
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        ports:
        - containerPort: {{ $svc.port }}
        env:
        - name: PORT
          value: {{ $svc.port | quote }}
        resources:
          {{- toYaml $.Values.resources | nindent 10 }}
        # JVM start can take a while: liveness/readiness start only after startupProbe succeeds
        startupProbe:
          httpGet:
            path: /health
            port: {{ $svc.port }}
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: {{ $svc.port }}
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: {{ $svc.port }}
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "food-delivery.labels" $ | nindent 4 }}
spec:
  selector:
    app: {{ $name }}
  ports:
  - port: {{ $svc.port }}
    targetPort: {{ $svc.port }}
{{- if $svc.autoscaling }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "food-delivery.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
