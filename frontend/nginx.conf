server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # /api/<service>/... -> http://<service>-service:<port>/...
    location /api/auth/ {
        proxy_pass http://auth-service:8081/;
    }
    location /api/restaurant/ {
        proxy_pass http://restaurant-service:8082/;
    }
    location /api/order/ {
        proxy_pass http://order-service:8083/;
    }
    location /api/payment/ {
        proxy_pass http://payment-service:8084/;
    }
    location /api/delivery/ {
        proxy_pass http://delivery-service:8085/;
    }
    location /api/notification/ {
        proxy_pass http://notification-service:8086/;
    }
}
